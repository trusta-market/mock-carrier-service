# K8s 환경 전용 override (SPRING_PROFILES_ACTIVE=k8s 일 때만 로드).

spring:
  kafka:
    # GKE namespace 'kafka' 의 StatefulSet 3 broker.
    bootstrap-servers: kafka.kafka:9092

server:
  port: 8300

# k8s 에선 INFO 가 default — DEBUG 는 cluster log 비용 + signal 묻힘. 필요 시 별도 조정.
logging:
  level:
    com.trustamarket.mockcarrierservice: INFO

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
