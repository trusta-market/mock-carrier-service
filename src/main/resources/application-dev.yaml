# K8s 환경 전용 override (SPRING_PROFILES_ACTIVE=k8s 일 때만 로드).

spring:
  kafka:
    bootstrap-servers: kafka.kafka:9092

server:
  port: 8300

logging:
  level:
    com.trustamarket.mockcarrierservice: INFO

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
